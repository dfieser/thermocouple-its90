name: Sync website calculator

# When a push changes the engine or data, regenerate the vendored block and
# push it to the dfieser.com repository, whose own deploy pipeline (with its
# fail-closed checks) publishes it. Stamp-only differences are not pushed,
# so routine commits here do not become website commits; run manually with
# force=true to push a provenance-stamp refresh.
#
# Auth: WEBSITE_SYNC_KEY, an SSH deploy key scoped to the dfieser.com
# repository only, stored exclusively in this repository's encrypted
# secrets. Revoke any time under dfieser.com > Settings > Deploy keys.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "src/**"
      - "codegen/**"
  workflow_dispatch:
    inputs:
      force:
        description: "Also push when only the provenance stamp changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-website
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout library
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prove the library before exporting it
        run: |
          python -m pip install --quiet pytest
          python -m pip install --quiet -e .
          python -m pytest -q

      - name: Generate the site block
        run: python codegen/emit_site_block.py --out block.html --commit "${GITHUB_SHA::7}"

      - name: Sync to the website repository
        env:
          SYNC_KEY: ${{ secrets.WEBSITE_SYNC_KEY }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ -z "$SYNC_KEY" ]; then
            echo "::warning title=Website sync::WEBSITE_SYNC_KEY secret is not set; skipping"
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SYNC_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          git clone --quiet --depth 1 git@github.com:dfieser/dfieser.com.git site
          STATUS=$(python site/scripts/sync-thermocouple.py \
                     --block block.html \
                     --page site/ThermocoupleConverter/index.html | tail -1)
          echo "$STATUS"
          if [ "$STATUS" = "status: content-changed" ] \
             || { [ "$FORCE" = "true" ] && [ "$STATUS" = "status: stamp-only" ]; }; then
            cd site
            git config user.name "thermocouple-its90 sync"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ThermocoupleConverter/index.html
            git commit -m "ThermocoupleConverter: sync engine to thermocouple-its90 ${GITHUB_SHA::7}"
            git push origin main
            echo "pushed; the website deploy pipeline takes it from here"
          else
            echo "no calculator change to publish"
          fi
