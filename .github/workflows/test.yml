name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --quiet pytest ruff
          python -m pip install --quiet -e .

      # The MCP SDK needs Python 3.10 or newer, so the 3.9 job runs without
      # it and tests/test_mcp_server.py skips itself there.
      - name: Install the MCP extra
        if: matrix.python-version != '3.9'
        run: python -m pip install --quiet -e ".[mcp]"

      - name: Lint
        run: ruff check .

      - name: Test (includes all 12,026 NIST table points)
        run: pytest

  # mcp 2.0 renamed FastMCP to MCPServer and moved the module, which broke
  # every fresh install of the [mcp] extra while the matrix above stayed
  # green. Build the server against both SDK lines so a rename cannot ship
  # unnoticed again.
  mcp-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mcp-spec: ["mcp>=1.7,<2", "mcp>=2,<3"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install with ${{ matrix.mcp-spec }}
        run: |
          python -m pip install --quiet pytest -e .
          python -m pip install --quiet "${{ matrix.mcp-spec }}"

      - name: Build the server and check its tool annotations
        run: pytest tests/test_mcp_server.py -q

  # The Dockerfile is what the Glama registry builds to run its own checks,
  # so it is tested here rather than trusted. The container is driven over a
  # real stdio MCP handshake, with the network switched off to prove the
  # server needs nothing but itself.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the image
        run: docker build -t thermocouple-its90-mcp:ci .

      - name: Talk to the container over stdio
        run: python .github/scripts/docker_smoke.py
